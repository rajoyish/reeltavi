<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ReelTavi — Facebook Video Controller</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1><img src="icons/icon48.png" width="24" height="24" alt="">ReelTavi — Facebook Video Controller</h1>
  <p class="sub">Hover over a Reel to show playback controls above the page name. Double-click a video to toggle fullscreen.</p>

  <label class="row">
    <input type="checkbox" id="showButton">
    <span>Show custom control bar on videos</span>
  </label>

  <label class="row">
    <input type="checkbox" id="doubleClick">
    <span>Double-click video to toggle fullscreen</span>
  </label>

  <label class="row">
    <input type="checkbox" id="autoFullscreenReels">
    <span>Auto-fullscreen Reels when they start playing</span>
  </label>
  <p class="hint">Auto-fullscreen needs a recent click/tap — Chrome blocks fullscreen without one. If it doesn't trigger, tap the fullscreen button in the control bar.</p>

  <button id="fullscreenNow" type="button">Make current video fullscreen</button>
  <p id="status" class="status" role="status"></p>

  <script src="popup.js"></script>
</body>
</html>
